<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MKC - weather</title>
        <link rel="stylesheet" href="./gridlayout.css">
    </head>
    <body>
        <div class="bodygrid">
            <div class="liveweather">
                <p>Live Weather</p>
            </div>
            <div class="liveforecast">
                <p>Live Forecast</p>
            </div>
            <div class="currentwind&humidity">
                <p>Current Wind & Humidity</p>
            </div>
            <div class="weeklyforecast">
                <div class="weekdaycard">Mon</div>
                <div class="weekdaycard">Tue</div>
                <div class="weekdaycard">Wed</div>
                <div class="weekdaycard">Thu</div>
                <div class="weekdaycard">Fri</div>
                <div class="weekdaycard">Sat</div>
                <div class="weekdaycard">Sun</div>
            </div>
        </div>
    </body>

</html>
