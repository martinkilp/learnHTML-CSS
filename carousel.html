<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> MKC - Carousel</title>
    <style></style>
    <link rel="stylesheet" href="./carousel.css">
</head>

<body>
    <div>
        <div class="carousel-top">
            <div class="group-top">
                <div class="card-top">1</div>
                <div class="card-top">2</div>
                <div class="card-top">3</div>
                <div class="card-top">4</div>
                <div class="card-top">5</div>
                <div class="card-top">6</div>
            </div>
            <div aria-hidden class="group-top">
                <div class="card-top">1</div>
                <div class="card-top">2</div>
                <div class="card-top">3</div>
                <div class="card-top">4</div>
                <div class="card-top">5</div>
                <div class="card-top">6</div>
            </div>
        </div>

    </div>
    
    <div class="carousel">
            <div class="group">
                <div class="card"><img src="https://img.shields.io/badge/HTML5-%23E34F26.svg?style=for-the-badge&logo=html5&logoColor=white" alt="Image 1"></div>
                <div class="card"><img src="https://img.shields.io/badge/CSS3-%231572B6.svg?style=for-the-badge&logo=css3&logoColor=white" alt="Image 2"></div>
                <div class="card"><img src="https://img.shields.io/badge/JavaScript-%23F7DF1E.svg?style=for-the-badge&logo=javascript&logoColor=white" alt="Image 3"></div>
                <div class="card"><img src="https://img.shields.io/badge/Python-%233776AB.svg?style=for-the-badge&logo=python&logoColor=white" alt="Image 4"></div>
                <div class="card"><img src="https://img.shields.io/badge/React-%2361DAFB.svg?style=for-the-badge&logo=react&logoColor=white" alt="Image 5"></div>
                <div class="card"><img src="https://img.shields.io/badge/Node.js-%23339933.svg?style=for-the-badge&logo=node.js&logoColor=white" alt="Image 6"></div>
            </div>
            <div aria-hidden class="group">
                <div class="card"><img src="https://img.shields.io/badge/HTML5-%23E34F26.svg?style=for-the-badge&logo=html5&logoColor=white" alt="Image 1"></div>
                <div class="card"><img src="https://img.shields.io/badge/CSS3-%231572B6.svg?style=for-the-badge&logo=css3&logoColor=white" alt="Image 2"></div>
                <div class="card"><img src="https://img.shields.io/badge/JavaScript-%23F7DF1E.svg?style=for-the-badge&logo=javascript&logoColor=white" alt="Image 3"></div>
                <div class="card"><img src="https://img.shields.io/badge/Python-%233776AB.svg?style=for-the-badge&logo=python&logoColor=white" alt="Image 4"></div>
                <div class="card"><img src="https://img.shields.io/badge/React-%2361DAFB.svg?style=for-the-badge&logo=react&logoColor=white" alt="Image 5"></div>
                <div class="card"><img src="https://img.shields.io/badge/Node.js-%23339933.svg?style=for-the-badge&logo=node.js&logoColor=white" alt="Image 6"></div>
            </div>
    </div>


</body>

</html>
