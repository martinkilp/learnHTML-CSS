<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo.no - Weather</title>
</head>

<body>

    <header>

    </header>

    <main>
        <h1>Yo.no Weather</h1>
        <h2>Tallinn</h2>
        <p>Temperatuur: <span id="temperature">Laen...</span></p>
        <p>Niiskus: <span id="humidity">Laen...</span></p>
        <p>Tuul: <span id="wind">Laen...</span></p>

        <h3>Järgmised tunnid</h3>
        <ul id="forecast">
            <li>Järgnev päev</li>
        </ul>

        <script>
            let laiuskraad = 59.4370;
            let pikkuskraad = 24.7536;

            const apiUrl =
                "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=" +
                laiuskraad + "&lon=" + pikkuskraad;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {

                    const timeseries = data.properties.timeseries;
                    const current = timeseries[0];

                    const temperature =
                        current.data.instant.details.air_temperature;

                    const humidity =
                        current.data.instant.details.relative_humidity;

                    const wind =
                        current.data.instant.details.wind_speed;

                    document.getElementById("temperature").textContent =
                        temperature + " °C";

                    document.getElementById("humidity").textContent =
                        humidity + " %";

                    document.getElementById("wind").textContent =
                        wind + " m/s";

                    

                    const tunnid = [3, 6];
                    const forecastList = document.getElementById("forecast");
                    forecastList.innerHTML = "";

                    for (let i = 0; i < tunnid.length; i++) {
                        const h = tunnid[i];
                        const entry = timeseries[h];

                        const aeg = new Date(entry.time).toLocaleTimeString("et-EE", {
                            hour: "2-digit",
                            minute: "2-digit"
                        });
                        const temp = entry.data.instant.details.air_temperature;

                        const li = document.createElement("li");
                        li.textContent = h + " tunni pärast (" + aeg + "): " + temp + " °C";
                        forecastList.appendChild(li);
                    }

                });
        </script>

    </main>

</body>

</html>
