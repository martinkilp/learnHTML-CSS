<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MKC - weather</title>
        <link rel="stylesheet" href="./weather_gridlayout.css">
    </head>
    <body>
        <div class="bodygrid">
            <div class="liveweather">
                <div class="todayweather">
                    <div class="img_todayweather">
                    </div>
                    <div class="todayweather2">
                        <p>Monday, 12:00</p>
                        <h3>Cloudy, 10 C</h3>
                        <p>Estonia, Tallinn</p>
                    </div>
                </div>
                <div class="wind-humidity">
                    <p>Wind-Humidity</p>
                </div>
                <div class="liveforecast">
                    <p>Live Forecast</p>
                </div>
            </div>
            
            <div class="sunsetime">
                    <p>Sunsettime</p>
            </div>

            <div class="weeklyforecast">
               <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Mon</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_mon" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_mon">mon</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_mon">mon</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Tue</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_tue" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_tue">tue</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_tue">tue</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Wen</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_wed" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_wed">wed</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_wed">wed</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Thu</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_thu" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_thu">thu</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_thu">thu</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Fri</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_fri" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_fri">fri</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_fri">fri</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Sat</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_sat" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_sat">sat</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_sat">sat</p>
                    </div>
                </div>
                <div class="weekdaycard">
                    <div class="weekdaycard_name">
                        <p>Sun</p>
                    </div>
                    <div class="weekdaycard_img">
                        <img id="img_sun" src="./icons/weathericons/cloud_24dp_opsz24.svg">
                    </div>
                    <div class="weekdaycard_day">    
                        <p id="day_sun">sun</p>
                    </div>
                    <div class="weekdaycard_night">
                        <p id="night_sun">sun</p>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
